<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jamesy's Start Page</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --bg:#0f1115; --card:#181b22; --line:#262b35; --fg:#e6e8ec; --mute:#8b93a1; --accent:#d97757; --warn:#e5a93c; --bad:#e0596a;
    --grid:#262b35; --axis:#3a4150;
    /* station series colors (validated, dark steps) */
    --c-temp:#d95926; --c-hum:#199e70; --c-pres:#008300; --c-wind:#9085e9; --c-rain:#3987e5; --c-lux:#c98500; --c-volt:#d55181;
  }
  @media (prefers-color-scheme: light) { :root {
    --bg:#f4f4f1; --card:#fff; --line:#e3e2dc; --fg:#1d2026; --mute:#6b7280;
    --grid:#ecece7; --axis:#c9c8c0;
    --c-temp:#eb6834; --c-hum:#1baf7a; --c-pres:#008300; --c-wind:#6250d6; --c-rain:#2a78d6; --c-lux:#eda100; --c-volt:#e87ba4;
  } }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:1280px; margin:0 auto; padding:24px 16px 48px; }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:20px; flex-wrap:wrap; gap:8px }
  h1 { font-size:26px; margin:0; font-weight:600 } #clock { color:var(--mute) }
  .brand { display:flex; align-items:center; gap:10px }
  .logo { width:34px; height:34px }
  .tabs { display:flex; gap:6px }
  .tabs button, .ranges button { background:none; border:1px solid var(--line); color:var(--mute); border-radius:999px; padding:5px 14px; font:inherit; font-size:13px; cursor:pointer }
  .tabs button:hover, .ranges button:hover { color:var(--fg) }
  .tabs button.on, .ranges button.on { color:var(--fg); border-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent) }
  .grid { display:grid; gap:16px; grid-template-columns:repeat(12,1fr) }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; min-width:0 }
  .card h2 { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); margin:0 0 12px; font-weight:600 }
  .news { grid-column:span 7 } .side { grid-column:span 5; display:grid; gap:16px; align-content:start }
  .col4 { grid-column:span 6 }
  @media (max-width:900px) { .news,.side,.col4 { grid-column:1/-1 } }
  a { color:inherit; text-decoration:none } a:hover { color:var(--accent) }
  ul { list-style:none; margin:0; padding:0 } li { padding:8px 0; border-top:1px solid var(--line) } li:first-child { border-top:0; padding-top:0 }
  .src { color:var(--accent); font-size:12px; margin-right:6px } .meta { color:var(--mute); font-size:12px }
  .brief div { margin-bottom:8px }
  .brief { border-left:3px solid var(--accent); padding-left:12px; margin-bottom:14px }
  .wx-now { display:flex; align-items:center; gap:14px } .wx-temp { font-size:44px; font-weight:600; line-height:1 } .wx-ico { font-size:44px }
  .days { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:14px; text-align:center; font-size:13px }
  .days div { background:var(--bg); border-radius:8px; padding:8px 4px }
  .sev1 { color:var(--warn) } .sev2,.sev3,.sev4 { color:var(--bad) }
  .links a { display:inline-block; margin:6px 8px 0 0; padding:4px 10px; border:1px solid var(--line); border-radius:999px; font-size:13px }
  .err { color:var(--mute); font-style:italic }
  /* station */
  .st-bar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px }
  .banner { border:1px solid var(--warn); background:color-mix(in srgb, var(--warn) 12%, transparent);
            border-radius:12px; padding:10px 14px; font-size:13px; margin-bottom:16px }
  .tile.warn .t-val, .tile.warn .t-sub { color:var(--warn) }
  .tile.bad .t-val, .tile.bad .t-sub { color:var(--bad) }
  .ranges { display:flex; gap:6px }
  .tiles { display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); margin-bottom:16px }
  .tile .t-label { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); font-weight:600; margin-bottom:6px }
  .tile .t-val { font-size:28px; font-weight:600; line-height:1.1 }
  .tile .t-val small { font-size:15px; font-weight:400; color:var(--mute); margin-left:2px }
  .tile .t-sub { color:var(--mute); font-size:12px; margin-top:4px }
  .tile .t-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px; vertical-align:1px }
  .charts { grid-template-columns:repeat(auto-fill,minmax(320px,1fr)) }
  .chart svg { display:block; width:100% }
  .chart text { font-size:11px; fill:var(--mute) }
  .chart .end-lbl { font-size:12px; font-weight:600; fill:var(--fg) }
  #tip { position:fixed; z-index:10; pointer-events:none; background:var(--card); border:1px solid var(--line); border-radius:8px;
         padding:7px 10px; font-size:12px; box-shadow:0 4px 14px rgba(0,0,0,.25); display:none }
  #tip .tv { font-size:14px; font-weight:600 } #tip .tt { color:var(--mute); margin-top:2px }
  #tip .key { display:inline-block; width:12px; height:0; border-top:2px solid; border-radius:2px; margin-right:6px; vertical-align:3px }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand"><img class="logo" src="/logo.png" alt="" width="34" height="34"><h1 id="greet">Hello</h1></div>
    <nav class="tabs" id="tabs">
      <button data-view="home" class="on">Home</button>
      <button data-view="station">Weather station</button>
    </nav>
    <span id="clock"></span>
  </header>

  <div class="grid" id="view-home">
    <section class="card news"><h2>World news · Trump filtered</h2><div id="brief"></div><ul id="news"></ul></section>
    <div class="side">
      <section class="card"><h2 id="wx-h">Weather</h2><div id="weather"></div></section>
      <section class="card"><h2>Traffic</h2><div id="traffic"></div></section>
    </div>
    <section class="card col4"><h2>Latest Claude artifacts</h2><ul id="artifacts"></ul></section>
    <section class="card col4"><h2>Notion · recently edited</h2><ul id="notion"></ul></section>
  </div>

  <div id="view-station" hidden>
    <div class="st-bar">
      <div class="ranges" id="ranges">
        <button data-r="today">Today</button>
        <button data-r="24h" class="on">24 h</button>
        <button data-r="7d">7 d</button>
        <button data-r="30d">30 d</button>
      </div>
      <span class="meta" id="st-status"></span>
    </div>
    <div class="banner" id="st-alert" hidden></div>
    <div class="tiles" id="tiles"></div>
    <div class="grid charts" id="charts"></div>
  </div>
</main>
<div id="tip"></div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const j = async (u) => { const r = await fetch(u); const d = await r.json(); if (!r.ok) throw new Error(d.error || r.status); return d; };
const ago = (t) => { const m = Math.max(1, (Date.now() - new Date(t)) / 60000 | 0); return m < 60 ? m + 'm' : m < 1440 ? (m / 60 | 0) + 'h' : (m / 1440 | 0) + 'd'; };
const fail = (el, e) => { el.innerHTML = `<span class="err">${esc(e.message)}</span>`; };

function tick() {
  const d = new Date(), h = d.getHours();
  $('greet').textContent = `Good ${h < 12 ? 'morning' : h < 18 ? 'afternoon' : 'evening'}, James`;
  $('clock').textContent = d.toLocaleString('en-GB', { weekday:'long', day:'numeric', month:'long', hour:'2-digit', minute:'2-digit' });
}
tick(); setInterval(tick, 30000);

const WMO = (c) => c === 0 ? ['☀️','Clear'] : c < 3 ? ['🌤️','Partly cloudy'] : c === 3 ? ['☁️','Overcast'] : c < 50 ? ['🌫️','Fog']
  : c < 60 ? ['🌦️','Drizzle'] : c < 70 ? ['🌧️','Rain'] : c < 80 ? ['🌨️','Snow'] : c < 90 ? ['🌧️','Showers'] : ['⛈️','Thunderstorm'];

async function weather() {
  try {
    const w = await j('/api/weather'), c = w.current, [ico, txt] = WMO(c.weather_code);
    $('wx-h').textContent = `Weather · ${w.place}`;
    $('weather').innerHTML = `<div class="wx-now"><span class="wx-ico">${ico}</span><div><div class="wx-temp">${Math.round(c.temperature_2m)}°</div>
      <div class="meta">${txt} · feels ${Math.round(c.apparent_temperature)}° · ${Math.round(c.wind_speed_10m)} mph</div></div></div>
      <div class="days">${w.daily.time.map((t, i) => `<div><div class="meta">${i ? new Date(t).toLocaleDateString('en-GB',{weekday:'short'}) : 'Today'}</div>
      <div>${WMO(w.daily.weather_code[i])[0]}</div><div>${Math.round(w.daily.temperature_2m_max[i])}° <span class="meta">${Math.round(w.daily.temperature_2m_min[i])}°</span></div>
      <div class="meta">${w.daily.precipitation_probability_max[i]}% rain</div></div>`).join('')}</div>`;
  } catch (e) { fail($('weather'), e); }
}

async function traffic() {
  try {
    const t = await j('/api/traffic').catch(() => ({ incidents: null, links: {} }));
    const l = t.links || {};
    const lk = `<div class="links"><a href="${esc(l.google)}" target="_blank">Google traffic map</a><a href="${esc(l.nh)}" target="_blank">National Highways</a><a href="${esc(l.traveline)}" target="_blank">Traveline</a></div>`;
    if (t.incidents === null) $('traffic').innerHTML = `<span class="meta">Set TOMTOM_KEY for live incidents.</span>${lk}`;
    else if (!t.incidents.length) $('traffic').innerHTML = `<div>✅ No notable delays nearby.</div>${lk}`;
    else $('traffic').innerHTML = `<ul>${t.incidents.map((i) => `<li><span class="sev${i.severity}">●</span> <b>${esc(i.road)}</b> ${esc(i.text)}
      <div class="meta">${esc(i.from)}${i.to ? ' → ' + esc(i.to) : ''}${i.delayMin ? ` · +${i.delayMin} min` : ''}</div></li>`).join('')}</ul>${lk}`;
  } catch (e) { fail($('traffic'), e); }
}

async function news() {
  j('/api/briefing').then((b) => { if (!b.items) $('brief').innerHTML = `<div class="err">Claude briefing: ${esc(b.reason)}</div>`; else $('brief').innerHTML = `<div class="brief">${b.items.map((i) => `<div><span class="src">${esc(i.category)}</span><b>${esc(i.headline)}</b><div class="meta">${esc(i.summary)}</div></div>`).join('')}</div>`; }).catch((e) => { $('brief').innerHTML = `<div class="err">Claude briefing: ${esc(e.message.slice(0, 160))}</div>`; });
  try {
    const n = await j('/api/news');
    $('news').innerHTML = n.map((i) => `<li><a href="${esc(i.link)}" target="_blank" rel="noopener"><span class="src">${esc(i.source)}</span>${esc(i.title)}</a>
      <div class="meta">${ago(i.date)} ago</div></li>`).join('');
  } catch (e) { fail($('news'), e); }
}

async function artifacts() {
  try {
    const a = await j('/api/artifacts');
    $('artifacts').innerHTML = a.map((x) => `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a><div class="meta">${esc(x.updated)}</div></li>`).join('') || '<span class="err">None yet</span>';
  } catch (e) { fail($('artifacts'), e); }
}

async function notion() {
  try {
    const n = await j('/api/notion');
    if (!n.pages) return $('notion').innerHTML = `<span class="err">${esc(n.reason)}</span>`;
    $('notion').innerHTML = n.pages.map((p) => `<li><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.icon)} ${esc(p.title)}</a><div class="meta">edited ${ago(p.edited)} ago</div></li>`).join('');
  } catch (e) { fail($('notion'), e); }
}

/* ---------- weather station ---------- */

const MPH = 2.23694;
const compact = (v) => v >= 10000 ? (v / 1000).toFixed(1) + 'K' : v >= 1000 ? (v / 1000).toFixed(2) + 'K' : String(Math.round(v));
const COMPASS = (d) => ['N','NE','E','SE','S','SW','W','NW'][Math.round(((d % 360) + 360) % 360 / 45) % 8];
const METRICS = [
  { key:'temperature', label:'Temperature', unit:'°C', dp:1, cvar:'--c-temp' },
  { key:'humidity',    label:'Humidity',    unit:'%',   dp:0, cvar:'--c-hum', min0:true },
  { key:'pressure',    label:'Pressure',    unit:'hPa', dp:0, cvar:'--c-pres' },
  { key:'wind_speed',  label:'Wind speed',  unit:'mph', dp:1, cvar:'--c-wind', scale:MPH, min0:true },
  { key:'rain',        label:'Rain',        unit:'mm',  dp:2, cvar:'--c-rain', bars:true, min0:true },
  { key:'luminance',   label:'Luminance',   unit:'lx',  dp:0, cvar:'--c-lux', min0:true, compact:true },
  { key:'voltage',     label:'Battery',     unit:'V',   dp:2, cvar:'--c-volt' },
];
const fmtV = (m, v) => m.compact ? compact(v) : v.toFixed(m.dp);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

let stRange = '24h', stData = null, stLoaded = false;
try { stRange = localStorage.getItem('st-range') || '24h'; } catch {}

function niceTicks(min, max, n = 4) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min, mag = 10 ** Math.floor(Math.log10(span / n));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => span / s <= n) || 10 * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const out = [];
  for (let v = lo; v <= hi + step / 1e6; v += step) out.push(+v.toPrecision(12));
  return out;
}
const fmtT = (t, range) => new Date(t).toLocaleString('en-GB',
  range === '7d' ? { weekday:'short', hour:'2-digit', minute:'2-digit' }
  : range === '30d' ? { day:'numeric', month:'short' }
  : { hour:'2-digit', minute:'2-digit' });

const tip = $('tip');
function showTip(x, y, value, when, color) {
  tip.textContent = '';
  const v = document.createElement('div'); v.className = 'tv';
  const k = document.createElement('span'); k.className = 'key'; k.style.borderTopColor = color;
  v.append(k, document.createTextNode(value));
  const t = document.createElement('div'); t.className = 'tt'; t.textContent = when;
  tip.append(v, t); tip.style.display = 'block';
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(x + 14, innerWidth - r.width - 8) + 'px';
  tip.style.top = Math.max(8, Math.min(y - r.height - 10, innerHeight - r.height - 8)) + 'px';
}
const hideTip = () => { tip.style.display = 'none'; };

function drawChart(card, m, pts, range) {
  const W = card.clientWidth - 34, H = 170;
  const ML = 38, MR = 50, MT = 10, MB = 20, PW = W - ML - MR, PH = H - MT - MB;
  const color = css(m.cvar), cardBg = css('--card');
  const vals = pts.map((p) => p[1]);
  const yt = niceTicks(m.min0 ? Math.min(0, ...vals) : Math.min(...vals), Math.max(...vals, m.min0 ? 1 : -Infinity));
  const y0 = yt[0], y1 = yt[yt.length - 1];
  const t0 = pts[0][0], t1 = pts[pts.length - 1][0] || 1;
  const X = (t) => ML + (t1 === t0 ? PW / 2 : (t - t0) / (t1 - t0) * PW);
  const Y = (v) => MT + PH - (v - y0) / (y1 - y0 || 1) * PH;
  const yl = (v) => m.compact ? compact(v) : +v.toFixed(6);

  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
  for (const v of yt) s += `<line x1="${ML}" x2="${W - MR}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-width="1"/>
    <text x="${ML - 6}" y="${Y(v) + 3.5}" text-anchor="end" style="font-variant-numeric:tabular-nums">${yl(v)}</text>`;
  const nx = Math.min(4, pts.length);
  for (let i = 0; i < nx; i++) {
    const t = t0 + (t1 - t0) * (nx === 1 ? 0.5 : i / (nx - 1));
    s += `<text x="${X(t)}" y="${H - 5}" text-anchor="${i === 0 ? 'start' : i === nx - 1 ? 'end' : 'middle'}">${fmtT(t, range)}</text>`;
  }
  s += `<line x1="${ML}" x2="${W - MR}" y1="${MT + PH}" y2="${MT + PH}" stroke="var(--axis)" stroke-width="1"/>`;

  if (m.bars) {
    const slot = PW / pts.length, bw = Math.max(2, Math.min(24, slot - 2));
    let maxI = 0;
    pts.forEach((p, i) => { if (p[1] > pts[maxI][1]) maxI = i; });
    pts.forEach(([t, v], i) => {
      const x = X(t) - bw / 2, yTop = Y(v), h = MT + PH - yTop;
      if (h > 0.5) {
        const r = Math.min(4, h, bw / 2);
        s += `<path d="M${x},${MT + PH} V${yTop + r} Q${x},${yTop} ${x + r},${yTop} H${x + bw - r} Q${x + bw},${yTop} ${x + bw},${yTop + r} V${MT + PH} Z" fill="${color}" data-i="${i}" class="bar"/>`;
      }
      s += `<rect x="${X(t) - slot / 2}" y="${MT}" width="${slot}" height="${PH}" fill="transparent" data-i="${i}" class="hit"/>`;
    });
    if (pts[maxI][1] > 0) s += `<text class="end-lbl" x="${X(pts[maxI][0])}" y="${Y(pts[maxI][1]) - 6}" text-anchor="middle">${fmtV(m, pts[maxI][1])}</text>`;
  } else {
    const line = pts.map(([t, v], i) => `${i ? 'L' : 'M'}${X(t).toFixed(1)},${Y(v).toFixed(1)}`).join('');
    s += `<path d="${line}L${X(t1).toFixed(1)},${MT + PH}L${X(t0).toFixed(1)},${MT + PH}Z" fill="${color}" opacity="0.1"/>`;
    s += `<path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const [lt, lv] = pts[pts.length - 1];
    s += `<circle cx="${X(lt)}" cy="${Y(lv)}" r="4" fill="${color}" stroke="${cardBg}" stroke-width="2"/>`;
    s += `<text class="end-lbl" x="${X(lt) + 9}" y="${Y(lv) + 4}">${fmtV(m, lv)}</text>`;
    s += `<line class="xh" x1="0" x2="0" y1="${MT}" y2="${MT + PH}" stroke="var(--axis)" stroke-width="1" visibility="hidden"/>`;
    s += `<circle class="xh-dot" r="4" fill="${color}" stroke="${cardBg}" stroke-width="2" visibility="hidden"/>`;
    s += `<rect x="${ML}" y="${MT}" width="${PW}" height="${PH}" fill="transparent" class="hover"/>`;
  }
  s += '</svg>';
  card.querySelector('.plot').innerHTML = s;

  const svg = card.querySelector('svg');
  const toLocal = (ev) => { const r = svg.getBoundingClientRect(); return (ev.clientX - r.left) / r.width * W; };
  if (m.bars) {
    svg.addEventListener('pointermove', (ev) => {
      const el = ev.target.closest('[data-i]'); if (!el) return hideTip();
      const [t, v] = pts[+el.dataset.i];
      svg.querySelectorAll('.bar').forEach((b) => b.style.opacity = b.dataset.i === el.dataset.i ? '1' : '0.75');
      showTip(ev.clientX, ev.clientY, `${fmtV(m, v)} ${m.unit}`, fmtT(t, range), color);
    });
    svg.addEventListener('pointerleave', () => { hideTip(); svg.querySelectorAll('.bar').forEach((b) => b.style.opacity = '1'); });
  } else {
    const xh = svg.querySelector('.xh'), dot = svg.querySelector('.xh-dot');
    svg.addEventListener('pointermove', (ev) => {
      const px = toLocal(ev);
      if (px < ML - 10 || px > W - MR + 10) return;
      let best = 0, bd = Infinity;
      pts.forEach(([t], i) => { const d = Math.abs(X(t) - px); if (d < bd) { bd = d; best = i; } });
      const [t, v] = pts[best];
      xh.setAttribute('x1', X(t)); xh.setAttribute('x2', X(t)); xh.setAttribute('visibility', 'visible');
      dot.setAttribute('cx', X(t)); dot.setAttribute('cy', Y(v)); dot.setAttribute('visibility', 'visible');
      showTip(ev.clientX, ev.clientY, `${fmtV(m, v)} ${m.unit}`, fmtT(t, range), color);
    });
    svg.addEventListener('pointerleave', () => { hideTip(); xh.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); });
  }
}

function tile(m, html, sub, cls) {
  return `<section class="card tile${cls ? ' ' + cls : ''}"><div class="t-label">${m.label}</div>
    <div class="t-val"><span class="t-dot" style="background:var(${m.cvar})"></span>${html}</div>
    ${sub ? `<div class="t-sub">${sub}</div>` : ''}</section>`;
}

function renderStation() {
  if (!stData) return;
  const { latest = {}, series = {}, rainToday = 0 } = stData;
  const L = (k) => latest[k]?.v;
  const t = [];
  if (L('temperature') != null) t.push(tile(METRICS[0], `${L('temperature').toFixed(1)}<small>°C</small>`));
  if (L('humidity') != null) t.push(tile(METRICS[1], `${Math.round(L('humidity'))}<small>%</small>`));
  if (L('pressure') != null) t.push(tile(METRICS[2], `${Math.round(L('pressure'))}<small>hPa</small>`));
  if (L('wind_speed') != null) t.push(tile(METRICS[3], `${(L('wind_speed') * MPH).toFixed(1)}<small>mph</small>`,
    L('wind_direction') != null ? `${COMPASS(L('wind_direction'))} · ${L('wind_speed').toFixed(1)} m/s` : null));
  t.push(tile(METRICS[4], `${rainToday.toFixed(2)}<small>mm</small>`, 'since midnight'));
  if (L('luminance') != null) t.push(tile(METRICS[5], `${compact(L('luminance'))}<small>lx</small>`));
  if (L('voltage') != null) {
    const v = L('voltage'), cls = v < 2.8 ? 'bad' : v < 3.1 ? 'warn' : '';
    t.push(tile(METRICS[6], `${v.toFixed(2)}<small>V</small>`,
      cls === 'bad' ? 'critical — replace batteries' : cls === 'warn' ? 'low battery' : null, cls));
  }
  $('tiles').innerHTML = t.join('');

  const reported = latest.temperature?.t || latest.rain?.t;
  $('st-status').textContent = reported ? `perry · last report ${ago(reported)} ago` : 'no recent reports';

  const ageMin = reported ? (Date.now() - new Date(reported)) / 60000 : Infinity;
  const alert = $('st-alert');
  alert.hidden = ageMin <= 30;
  if (!alert.hidden) alert.textContent = reported
    ? `⚠️ Stale data — perry last reported ${ago(reported)} ago (${new Date(reported).toLocaleString('en-GB',
        { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })}). Check battery/power.`
    : '⚠️ No reports from perry in the last 48 h — check battery/power.';

  $('charts').innerHTML = METRICS.map((m) => (series[m.key] || []).length > 1
    ? `<section class="card chart" data-k="${m.key}"><h2>${m.label} · ${m.unit}</h2><div class="plot"></div></section>` : '').join('');
  for (const m of METRICS) {
    const card = $('charts').querySelector(`[data-k="${m.key}"]`);
    if (!card) continue;
    let pts = series[m.key];
    if (m.scale) pts = pts.map(([t, v]) => [t, v * m.scale]);
    drawChart(card, m, pts, stData.range);
  }
}

async function station(force) {
  $('ranges').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.r === stRange));
  try {
    const d = await j(`/api/station?range=${stRange}`);
    if (d.reason) { $('st-status').textContent = d.reason; return; }
    stData = d; stLoaded = true;
    renderStation();
  } catch (e) { $('st-status').textContent = `station: ${e.message}`; }
}

$('ranges').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  stRange = b.dataset.r;
  try { localStorage.setItem('st-range', stRange); } catch {}
  station();
});

/* tabs */
function setView(v) {
  $('view-home').hidden = v !== 'home';
  $('view-station').hidden = v !== 'station';
  $('tabs').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.view === v));
  try { localStorage.setItem('view', v); } catch {}
  if (v === 'station' && !stLoaded) station();
}
$('tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setView(b.dataset.view); });

let rsz; addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(renderStation, 150); });

const all = () => { weather(); traffic(); news(); artifacts(); notion(); if (stLoaded) station(); };
all(); setInterval(all, 10 * 60 * 1000);
if (location.hash === '#station') setView('station');
else try { if (localStorage.getItem('view') === 'station') setView('station'); } catch {}
</script>
</body>
</html>
